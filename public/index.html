<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%8F%81%3C/text%3E%3C/svg%3E">
<title>Pronostics - Tournoi Drone FPV</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; background: #12141c; color: #e8e8ee; padding: 12px; }
  .wrap { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 22px; text-align: center; margin: 8px 0 14px; }
  .card { background: #1d2030; border-radius: 12px; padding: 16px; margin-bottom: 12px; }
  label { display: block; font-size: 13px; color: #9aa0b8; margin: 10px 0 4px; }
  input { width: 100%; padding: 12px; font-size: 16px; border-radius: 8px; border: 1px solid #333850; background: #12141c; color: #fff; }
  .btn { width: 100%; padding: 13px; margin-top: 14px; font-size: 16px; font-weight: 700; border: 0; border-radius: 8px; background: #5b6cff; color: #fff; cursor: pointer; }
  .small { font-size: 13px; color: #9aa0b8; }
  .err { color: #ff6b6b; margin-top: 10px; font-size: 14px; }
  .top { display: flex; justify-content: space-between; align-items: center; }
  .link { background: none; border: 0; color: #9aa0b8; text-decoration: underline; cursor: pointer; font-size: 13px; }
  .tabs { display: flex; gap: 6px; margin-bottom: 12px; }
  .tabs button { flex: 1; padding: 10px 4px; border: 0; border-radius: 8px; background: #1d2030; color: #9aa0b8; font-weight: 600; font-size: 14px; cursor: pointer; }
  .tabs button.on { background: #5b6cff; color: #fff; }
  .filtre { display: flex; gap: 6px; margin-bottom: 10px; }
  .filtre button { padding: 6px 12px; border-radius: 20px; border: 1px solid #333850; background: none; color: #9aa0b8; cursor: pointer; }
  .filtre button.on { border-color: #5b6cff; color: #fff; }
  .jour { font-size: 13px; color: #9aa0b8; margin: 14px 0 6px; text-transform: uppercase; letter-spacing: .5px; }
  .match { background: #1d2030; border-radius: 10px; padding: 12px; margin-bottom: 8px; border-left: 4px solid #333850; }
  .match.ouvert { border-left-color: #3ecf8e; }
    .match.termine { border-left-color: #5b6cff; }
  .mhead { display: flex; justify-content: space-between; font-size: 13px; color: #9aa0b8; }
  .vs { font-size: 16px; font-weight: 700; margin: 6px 0 8px; }
  .vs span { color: #9aa0b8; font-weight: 400; }
  .scores { display: flex; gap: 6px; }
  .sc { flex: 1; padding: 10px 0; border-radius: 8px; border: 1px solid #333850; background: #12141c; color: #e8e8ee; font-weight: 700; font-size: 15px; cursor: pointer; }
  .sc.on { background: #3ecf8e; color: #12141c; border-color: #3ecf8e; }
  .sc:disabled { opacity: .45; cursor: not-allowed; }
  .sc.on:disabled { opacity: 1; background: #2a6b50; color: #fff; }
  .info { font-size: 13px; margin-top: 8px; color: #9aa0b8; }
  .ok { color: #3ecf8e; font-weight: 700; }
  .ko { color: #ff6b6b; font-weight: 700; }
  .res { font-size: 18px; font-weight: 800; color: #fff; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { padding: 8px 4px; text-align: left; border-bottom: 1px solid #2a2e42; }
  th { color: #9aa0b8; font-weight: 600; font-size: 12px; }
  td.n, th.n { text-align: right; }
  tr.moi td { color: #3ecf8e; font-weight: 700; }
  .legende { font-size: 12px; color: #9aa0b8; line-height: 1.6; }
  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: #3ecf8e; color: #12141c; padding: 10px 18px; border-radius: 8px; font-weight: 700; display: none; z-index: 9; }
  .toast.e { background: #ff6b6b; color: #fff; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🏁 <span id="nomT">Pronostics</span></h1>

  <div class="card" id="login" style="display:none">
    <div class="small">Choisis un pseudo et un code à 4 chiffres. Si le pseudo n'existe pas, ton compte est créé. Garde ton code pour te reconnecter.</div>
    <label>Pseudo</label>
    <input id="pseudo" maxlength="20" autocomplete="nickname">
    <label>Code (4 chiffres)</label>
    <input id="pin" maxlength="4" inputmode="numeric" pattern="[0-9]*" type="password">
    <button class="btn" id="btnEntrer">Entrer</button>
    <div class="err" id="loginErr"></div>
  </div>

  <div id="app" style="display:none">
    <div class="card top">
      <div>👤 <b id="moiNom"></b><div class="small" id="moiPts"></div></div>
      <button class="link" id="btnSortir">Changer de compte</button>
    </div>
    <div class="tabs">
      <button data-tab="matchs" class="on">Matchs</button>
      <button data-tab="pilotes">Pilotes</button>
      <button data-tab="parieurs">Pronos</button>
    </div>
    <div id="vue"></div>
  </div>
  <div class="small" style="text-align:center;margin:18px 0 6px">Tournoi Pronostics v<span id="ver"></span></div>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let moi = null;
try { moi = JSON.parse(localStorage.getItem('prono_user') || 'null'); } catch (e) {}
let etat = null, offset = 0, onglet = 'matchs', filtre = 'avenir';

async function api(url, body) {
  const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || ('Erreur ' + r.status));
  return d;
}
function toast(msg, erreur) {
  const t = $('#toast'); t.textContent = msg; t.className = 'toast' + (erreur ? ' e' : ''); t.style.display = 'block';
  clearTimeout(t._t); t._t = setTimeout(() => t.style.display = 'none', 2500);
}
const heure = ms => new Date(ms).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });

async function entrer() {
  $('#loginErr').textContent = '';
  try {
    const d = await api('/api/entrer', { pseudo: $('#pseudo').value, pin: $('#pin').value });
    moi = { pseudo: d.pseudo, pin: $('#pin').value };
    try { localStorage.setItem('prono_user', JSON.stringify(moi)); } catch (e) {}
    toast(d.cree ? 'Compte créé, bienvenue !' : 'Content de te revoir !');
    await charger();
  } catch (e) { $('#loginErr').textContent = e.message; }
}
function sortir() {
  moi = null; try { localStorage.removeItem('prono_user'); } catch (e) {}
  afficher();
}

async function charger() {
  try {
    const d = await api('/api/state', moi || {});
    offset = d.serverTime - Date.now();
    etat = d;
    $('#ver').textContent = d.version; $('#nomT').textContent = 'Pronostics – ' + d.nomTournoi; document.title = 'Pronostics – ' + d.nomTournoi;
    if (moi && !d.connecte) { moi = null; try { localStorage.removeItem('prono_user'); } catch (e) {} }
    afficher();
  } catch (e) { /* serveur momentanément injoignable : on réessaie au prochain tour */ }
}

function afficher() {
  const connecte = !!(moi && etat && etat.connecte);
  $('#login').style.display = connecte ? 'none' : 'block';
  $('#app').style.display = connecte ? 'block' : 'none';
  if (!connecte || !etat) return;
  $('#moiNom').textContent = etat.pseudo;
  const me = etat.classementParieurs.find(p => p.pseudo === etat.pseudo);
  $('#moiPts').textContent = me ? `${me.points} point(s) · ${me.pronos} prono(s)` : '';
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === onglet));
  if (onglet === 'matchs') vueMatchs();
  else if (onglet === 'pilotes') vuePilotes();
  else vueParieurs();
}

function vueMatchs() {
  const liste = etat.matchs.filter(m => filtre === 'tous' || m.statut !== 'termine');
  let h = `<div class="filtre">
    <button data-f="avenir" class="${filtre === 'avenir' ? 'on' : ''}">À venir</button>
    <button data-f="tous" class="${filtre === 'tous' ? 'on' : ''}">Tous</button></div>
    <div class="legende">3 = victoire · 2 = termine les 3 tours mais perd · 0 = crash.<br>
    Score exact = 1 point. <b>Un prono compte seulement s'il est placé au moins ${etat.delai} min avant la saisie du résultat.</b> Si tu changes d'avis trop tard, c'est ton dernier prono déjà validé qui compte.</div>`;
  let j = null;
  if (!liste.length) h += '<div class="card small">Aucun match à afficher.</div>';
  liste.forEach(m => {
    if (m.journee !== j) { j = m.journee; h += `<div class="jour">Journée ${j}</div>`; }
    const ouvert = m.statut === 'ouvert';
    h += `<div class="match ${m.statut}" data-mid="${m.id}">
      <div class="mhead"><span>#${m.id}</span><span>${ouvert ? 'Pronos ouverts' : 'Terminé · ' + heure(m.resultAt)}</span></div>
      <div class="vs">${esc(m.p1)} <span>vs</span> ${esc(m.p2)}</div>`;
    if (!ouvert) {
      h += `<div class="res">Résultat : ${esc(m.score)}</div>`;
      if (m.monProno) {
        if (m.monRetenu) h += `<div class="info">Ton prono retenu : ${esc(m.monRetenu)} ${m.monRetenu === m.score ? '<span class="ok">✓ +1 point</span>' : '<span class="ko">✗</span>'}</div>`;
        else h += `<div class="info"><span class="ko">Ton prono a été placé moins de ${etat.delai} min avant le résultat : non compté.</span></div>`;
      }
    } else {
      h += '<div class="scores">' + etat.scores.map(s =>
        `<button class="sc ${m.monProno === s ? 'on' : ''}" data-s="${s}">${s}</button>`).join('') + '</div>';
      if (m.monProno) h += `<div class="info" data-valide="${m.monPronoT + etat.delai * 60000}"></div>`;
    }
    if (m.repartition && Object.keys(m.repartition).length) {
      h += '<div class="info">Pronos retenus du public : ' + Object.entries(m.repartition).map(([s, n]) => `${esc(s)} ×${n}`).join(' · ') + '</div>';
    }
    h += '</div>';
  });
  $('#vue').innerHTML = h;
  tick();
}

function vuePilotes() {
  let h = '<div class="card"><table><tr><th>#</th><th>Pilote</th><th class="n">V</th><th class="n">D</th><th class="n">C</th><th class="n">Pts</th></tr>';
  etat.classementPilotes.forEach((p, i) => {
    h += `<tr><td>${i + 1}</td><td>${esc(p.nom)}</td><td class="n">${p.v}</td><td class="n">${p.d}</td><td class="n">${p.c}</td><td class="n"><b>${p.points}</b></td></tr>`;
  });
  $('#vue').innerHTML = h + '</table><div class="legende" style="margin-top:8px">V = victoire (3) · D = défaite (2) · C = crash (0)</div></div>';
}

function vueParieurs() {
  let h = '<div class="card"><table><tr><th>#</th><th>Pseudo</th><th class="n">Pronos</th><th class="n">Points</th></tr>';
  if (!etat.classementParieurs.length) h += '<tr><td colspan="4" class="small">Personne pour l\'instant</td></tr>';
  etat.classementParieurs.forEach((p, i) => {
    h += `<tr class="${p.pseudo === etat.pseudo ? 'moi' : ''}"><td>${i + 1}</td><td>${esc(p.pseudo)}</td><td class="n">${p.pronos}</td><td class="n"><b>${p.points}</b></td></tr>`;
  });
  $('#vue').innerHTML = h + '</table></div>';
}

function tick() {
  const now = Date.now() + offset;
  document.querySelectorAll('[data-valide]').forEach(el => {
    const reste = Number(el.dataset.valide) - now;
    el.innerHTML = reste <= 0
      ? '<span class="ok">✓ Ton prono est validé</span> (il compte quel que soit le moment du résultat)'
      : `⏳ Ce prono sera validé dans ${Math.floor(reste / 60000)}:${String(Math.floor(reste / 1000) % 60).padStart(2, '0')}`;
  });
}

document.addEventListener('click', async e => {
  const t = e.target.closest('button');
  if (!t) return;
  if (t.id === 'btnEntrer') return entrer();
  if (t.id === 'btnSortir') return sortir();
  if (t.dataset.tab) { onglet = t.dataset.tab; return afficher(); }
  if (t.dataset.f) { filtre = t.dataset.f; return afficher(); }
  if (t.classList.contains('sc') && !t.disabled) {
    const mid = Number(t.closest('.match').dataset.mid);
    try {
      await api('/api/prono', { pseudo: moi.pseudo, pin: moi.pin, matchId: mid, score: t.dataset.s });
      toast('Prono enregistré : ' + t.dataset.s);
    } catch (err) { toast(err.message, true); }
    charger();
  }
});
$('#pin').addEventListener('keydown', e => { if (e.key === 'Enter') entrer(); });

charger();
setInterval(charger, 5000);
setInterval(tick, 1000);
</script>
</body>
</html>
